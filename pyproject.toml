[project]
name = "hannovators-deep-researcher"
version = "0.1.0"
description = "Python backend for Hannovators Deep Researcher."
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2.0",
    "defusedxml>=0.7.1,<0.8.0",
    "fastapi>=0.143.0,<0.144.0",
    "httpx>=0.28.1,<0.29.0",
    "numpy>=2.5.4,<3.0.0",
    "openai>=3.28.0,<4.0.0",
    "pydantic>=2.14.0,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "pymupdf>=1.28.2,<2.0.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.32,<0.0.33",
    "rank-bm25>=0.2.2,<0.3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "tavily-python>=0.8.5,<0.9.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
]

[dependency-groups]
dev = [
    "behave>=1.3.3,<2.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "respx>=0.23.1,<0.24.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling>=1.24,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hannovators_deep_researcher"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m \"not live\""
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast tests isolated from external systems",
    "integration: tests that exercise real integration boundaries",
    "live: one small request to a real provider; skips when its API key is missing",
    "e2e: the full pipeline through the HTTP API with fake adapters",
]

[tool.behave]
paths = ["tests/bdd/features"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".archive/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff-specific rules
    "C90",  # mccabe complexity
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
exclude = ["(?x)(^|[\\/])\\.archive([\\/]|$)"]
